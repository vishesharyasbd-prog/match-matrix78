<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6f2">

  <title>Match Matrix | Cricket Insights</title>
  <meta name="description" content="Join Match Matrix on Telegram for cricket insights, analysis and updates.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: #f7f6f2;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
      font-family: Arial, Helvetica, sans-serif;
      color: #22251f;
      background:
        radial-gradient(ellipse at 50% 0%, #eeeadf 0%, transparent 65%),
        #f7f6f2;
    }

    .mm-card {
      width: 100%;
      max-width: 390px;
      padding: 38px 26px 30px;
      text-align: center;
      background: #fff;
      border: 1px solid #e8e2d4;
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(35,35,25,.07);
    }

    .mm-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #cdb777;
      border-radius: 18px;
      background: #22251f;
      color: #e5cf92;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .mm-logo span {
      color: #fff;
    }

    .mm-eyebrow {
      margin-bottom: 12px;
      color: #947a40;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.2px;
    }

    .mm-card h1 {
      font-size: clamp(27px, 8vw, 35px);
      line-height: 1.2;
      letter-spacing: .5px;
      font-weight: 800;
      white-space: nowrap;
    }

    .mm-divider {
      width: 42px;
      height: 2px;
      margin: 22px auto;
      background: #c8ad6b;
    }

    .mm-description {
      max-width: 285px;
      margin: 0 auto 28px;
      color: #707168;
      font-size: 14px;
      line-height: 1.8;
    }

    .mm-join {
      min-height: 54px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 16px 12px;
      border: 1px solid #22251f;
      border-radius: 10px;
      background: #22251f;
      color: #f0dfb1;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: background .18s ease;
    }

    .mm-join:hover {
      background: #34382f;
    }

    .mm-join:focus-visible {
      outline: 3px solid #c8ad6b;
      outline-offset: 4px;
    }

    .mm-join svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    .mm-note {
      margin-top: 19px;
      color: #929187;
      font-size: 11px;
    }

    .mm-footer {
      margin-top: 29px;
      color: #b0a17b;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2.4px;
    }

    @media (max-width: 350px) {
      .mm-card {
        padding: 32px 18px 26px;
      }

      .mm-card h1 {
        font-size: 26px;
      }

      .mm-eyebrow {
        font-size: 9px;
        letter-spacing: 1.7px;
      }
    }
@media (prefers-reduced-motion: reduce) {
      .mm-join {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="mm-card">
    <div class="mm-logo" aria-hidden="true">M<span>M</span></div>

    <p class="mm-eyebrow">CRICKET • INSIGHTS • ANALYSIS</p>

    <h1>MATCH MATRIX</h1>

    <div class="mm-divider"></div>

    <p class="mm-description">
      Match insights, cricket analysis and updates.
      Join our Telegram channel to explore more.
    </p>

    <a
      class="mm-join"
      id="mm-join-btn"
      href="https://t.me/+dZqGYunQlQk0Zjll"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" fill="currentColor"
        aria-hidden="true">
        <path d="M21.8 3.2 18.5 20c-.25 1.18-.92 1.47-1.86.92l-5.13-3.78-2.48 2.39c-.28.28-.52.52-1.07.52l.38-5.22 9.5-8.58c.41-.36-.09-.56-.63-.2L5.47 13.34.4 11.75c-1.1-.34-1.12-1.1.23-1.64L20.46 2.5c.91-.34 1.71.21 1.34.7Z"/>
      </svg>
      JOIN TELEGRAM
    </a>

    <p class="mm-note">Quick access • Mobile friendly</p>

    <div class="mm-footer">MATCH MATRIX</div>
  </main>

  <script>
    (function () {
      var button = document.getElementById('mm-join-btn');
      var eventSent = false;

      button.addEventListener('click', function () {
        if (eventSent) return;
        eventSent = true;

        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Subscribe');
        }
      });
    })();
  </script>
</body>
</html>
